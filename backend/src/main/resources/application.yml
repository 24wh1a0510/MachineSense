server:
  port: 8080

spring:
  application:
    name: machinesense-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:machinesense}
    username: ${DB_USER:machinesense}
    password: ${DB_PASSWORD:machinesense}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    default-property-inclusion: non_null

ml-service:
  url: ${ML_SERVICE_URL:http://localhost:5000}

app:
  jwt:
    secret: ${JWT_SECRET:machinesense_super_secret_key_change_me_1234567890}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.machinesense: INFO
