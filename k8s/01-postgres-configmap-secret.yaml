apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: machinesense
type: Opaque
stringData:
  POSTGRES_DB: machinesense
  POSTGRES_USER: machinesense
  POSTGRES_PASSWORD: machinesense
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-schema
  namespace: machinesense
data:
  schema.sql: |
    -- Loaded from database/schema.sql at build time; see README for how to
    -- regenerate this ConfigMap with: kubectl create configmap postgres-init-schema
    -- --from-file=schema.sql=database/schema.sql -n machinesense --dry-run=client -o yaml
    -- Placeholder note: apply the real schema.sql via the README instructions.
